<meta name="theme-color" content="#101820">
<title>CommScope Employee Attendance Portal</title>

*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;background:#f4f6f8;color:#17202a}.topbar{background:#101820;color:#fff;padding:18px 5%;display:flex;justify-content:space-between;align-items:center}.brand{font-size:24px;font-weight:800}.subtitle{font-size:13px;color:#b9c1c8;margin-top:3px}.admin{font-size:14px}.container{max-width:1200px;margin:auto;padding:28px 18px}.hero{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:22px}.hero h1{margin:0 0 6px;font-size:28px}.hero p{margin:0;color:#65717c}button{border:0;border-radius:9px;padding:11px 16px;background:#101820;color:#fff;cursor:pointer}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:22px}.card{background:#fff;border:1px solid #e1e6ea;border-radius:14px;padding:18px;box-shadow:0 3px 12px #00000008}.card span{display:block;color:#6b7680;font-size:13px}.card strong{display:block;font-size:25px;margin-top:8px}.panel{background:#fff;border:1px solid #e1e6ea;border-radius:14px;overflow:hidden}.toolbar{display:flex;gap:10px;padding:16px;border-bottom:1px solid #e6eaed}.toolbar input,.toolbar select{padding:12px;border:1px solid #d7dde2;border-radius:9px;font-size:14px}.toolbar input{flex:1}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:760px}th,td{text-align:left;padding:13px 15px;border-bottom:1px solid #edf0f2;font-size:14px}th{background:#fafbfc;color:#59656f;font-size:12px;text-transform:uppercase}td button{padding:7px 10px;font-size:12px}.badge{display:inline-block;padding:4px 8px;border-radius:99px;font-size:12px;background:#edf2f5}.modal{position:fixed;inset:0;background:#0008;display:flex;align-items:center;justify-content:center;padding:18px}.hidden{display:none}.modal-box{position:relative;background:#fff;border-radius:16px;max-width:720px;width:100%;padding:24px}.close{position:absolute;right:15px;top:12px;background:transparent;color:#222;font-size:25px;padding:3px}.day-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:9px;margin-top:18px}.day{border:1px solid #e1e6ea;border-radius:10px;padding:12px;text-align:center}.day b{display:block;font-size:12px;color:#68737d;margin-bottom:6px}.P{border-left:4px solid #2f855a}.A{border-left:4px solid #c53030}.WO{border-left:4px solid #718096}.other{border-left:4px solid #d69e2e}@media(max-width:800px){.cards{grid-template-columns:repeat(2,1fr)}.hero{align-items:flex-start;flex-direction:column}.admin{display:none}}@media(max-width:430px){.container{padding:20px 12px}.cards{gap:9px}.card{padding:13px}.card strong{font-size:21px}.day-grid{grid-template-columns:repeat(3,1fr)}}


/* Standalone/mobile version */
.login-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:#f4f6f8}
.login-card{width:min(430px,100%);background:#fff;border:1px solid #e1e6ea;border-radius:18px;padding:28px;box-shadow:0 8px 30px rgba(0,0,0,.08)}
.login-card h1{margin:26px 0 6px}
.login-card label{display:block;font-size:14px;font-weight:600;margin:14px 0 6px}
.login-card input{width:100%;padding:13px;border:1px solid #d7dde2;border-radius:9px;font-size:16px}
.primary{background:#101820;color:#fff}
.full{width:100%;margin-top:16px}
.role-tabs{display:flex;gap:8px;margin-top:18px}
.role-tabs .role{flex:1;background:#eef1f4;color:#17202a}
.role-tabs .role.active{background:#101820;color:#fff}
.muted{color:#65717c}
.error{color:#c53030;min-height:20px}
.hint{font-size:12px;color:#65717c;margin-top:14px;line-height:1.5}
.top-actions{display:flex;align-items:center;gap:10px}
.ghost{background:transparent;border:1px solid #53606b}
@media(max-width:600px){
  .topbar{padding:14px 12px}
  .topbar .brand{font-size:20px}
  .container{padding:18px 10px}
  .hero h1{font-size:24px}
  .hero-actions{width:100%;display:flex;gap:8px}
  .hero-actions button{flex:1}
  .toolbar{flex-direction:column}
  .toolbar input,.toolbar select{width:100%}
  .modal{padding:8px}
  .modal-box{max-height:92vh;overflow:auto;padding:18px}
  .day-grid{grid-template-columns:repeat(3,1fr)}
  .profile-head{display:flex;justify-content:space-between;gap:12px}
}

</style>

<div id="loginScreen" class="login-screen">
  <div class="login-card"><div class="brand">CommScope</div><div class="subtitle">Employee Attendance Portal</div>
    <h1>Welcome back</h1><p class="muted">Sign in to continue</p>
    <div class="role-tabs"><button class="role active" data-role="employee">Employee</button><button class="role" data-role="admin">Admin</button></div>
    <label>Employee ID / Admin name</label><input id="loginId" placeholder="e.g. AD-12744 or Sunil">
    <label>Password</label><input id="loginPassword" type="password" placeholder="Enter password">
    <button id="loginBtn" class="primary full">Sign in</button><p id="loginError" class="error"></p>
    <div class="hint">Demo login: Employee ID + <b>1234</b> · Admin: <b>Sunil</b> + <b>admin123</b></div>
  </div>
</div>
<div id="app" class="hidden">
<header class="topbar"><div><div class="brand">CommScope</div><div class="subtitle">Employee Attendance Portal</div></div><div class="top-actions"><span id="userLabel"></span><button id="logoutBtn" class="ghost">Logout</button></div></header>
<main class="container">
<section class="hero"><div><div class="eyebrow">September 2026</div><h1 id="pageTitle">Attendance Dashboard</h1><p id="pageSubtitle">Data available through Day 9</p></div><div class="hero-actions"><button id="importBtn" class="secondary hidden">Import JSON</button><input id="fileInput" type="file" accept=".json" hidden><button id="printBtn">Print Report</button></div></section>
<section id="stats" class="cards"></section>
<section id="employeePanel" class="panel">
<div class="toolbar"><input id="search" type="search" placeholder="Search Employee ID or Name…"><select id="statusFilter"><option value="all">All Status</option><option>Active</option><option>Left</option></select></div>
<div class="table-wrap"><table><thead><tr><th>Employee ID</th><th>Name</th><th>Status</th><th>Present</th><th>Absent</th><th>Attendance %</th><th>Action</th></tr></thead><tbody id="employeeRows"></tbody></table></div></section>
<section id="employeeView" class="hidden"></section>
</main></div>
<div id="modal" class="modal hidden"><div class="modal-box"><button class="close" id="closeModal">×</button><div id="modalContent"></div></div></div>

<script>
const seed = ATTENDANCE_DATA;
const STORAGE='commscope_attendance_step6';
const db=JSON.parse(localStorage.getItem(STORAGE)||JSON.stringify(seed));
const employees=db.employees;
let role='employee', current=null;
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
function save(){localStorage.setItem(STORAGE,JSON.stringify(db));}
function calc(e){const vals=Object.values(e.attendance||{});const working=vals.filter(v=>v!=='WO'&&v!=='--');e.present=vals.filter(v=>v==='P').length;e.absent=vals.filter(v=>v==='A').length;e.workingDays=working.length;e.percentage=working.length?+(e.present/working.length*100).toFixed(1):0;}
function renderStats(list){const avg=list.length?list.reduce((a,e)=>a+e.percentage,0)/list.length:0;$('stats').innerHTML=`<div class="card"><span>Total Employees</span><strong>${list.length}</strong></div><div class="card"><span>Active</span><strong>${list.filter(e=>e.status==='Active').length}</strong></div><div class="card"><span>Left</span><strong>${list.filter(e=>e.status==='Left').length}</strong></div><div class="card"><span>Average Attendance</span><strong>${avg.toFixed(1)}%</strong></div>`;}
function renderTable(){const q=$('search').value.trim().toLowerCase(), st=$('statusFilter').value;const list=employees.filter(e=>(st==='all'||e.status===st)&&((e.employeeCode||'').toLowerCase().includes(q)||(e.employeeName||'').toLowerCase().includes(q)));renderStats(list);$('employeeRows').innerHTML=list.map(e=>`<tr><td><b>${esc(e.employeeCode)}</b></td><td>${esc(e.employeeName)}</td><td><span class="badge ${e.status==='Active'?'active':'left'}">${esc(e.status)}</span></td><td>${e.present}</td><td>${e.absent}</td><td><b>${e.percentage}%</b></td><td><button class="small" onclick="showEmployee('${esc(e.employeeCode)}')">View</button></td></tr>`).join('')||'<tr><td colspan="7" class="empty">No employees found.</td></tr>';}
function showEmployee(code){const e=employees.find(x=>x.employeeCode===code);if(!e)return;$('modalContent').innerHTML=`<div class="profile-head"><div><div class="eyebrow">Employee profile</div><h2>${esc(e.employeeName)}</h2><p>${esc(e.employeeCode)} · ${esc(e.contractor)} · ${esc(e.status)}</p></div><div class="big-stat">${e.percentage}%<small>Attendance</small></div></div><div class="day-grid">${Object.entries(e.attendance).map(([d,s])=>`<div class="day ${s==='P'?'P':s==='A'?'A':s==='WO'?'WO':'other'}"><b>Sep ${d}</b><span>${esc(s)}</span></div>`).join('')}</div>${role==='admin'?`<div class="edit-box"><h3>Edit attendance</h3><div class="edit-grid">${Object.entries(e.attendance).map(([d,s])=>`<label>Day ${d}<select data-day="${d}"><option ${s==='P'?'selected':''}>P</option><option ${s==='A'?'selected':''}>A</option><option ${s==='WO'?'selected':''}>WO</option><option ${s==='MP'?'selected':''}>MP</option><option ${s==='FD'?'selected':''}>FD</option><option ${s==='HD'?'selected':''}>HD</option><option ${s==='SLWP (Pending)'?'selected':''}>SLWP (Pending)</option><option ${s==='PL (Pending)'?'selected':''}>PL (Pending)</option><option ${s==='--'?'selected':''}>--</option></select></label>`).join('')}</div><button id="saveAttendance" class="primary">Save Changes</button></div>`:''}`;$('modal').classList.remove('hidden');$('saveAttendance')?.addEventListener('click',()=>{document.querySelectorAll('[data-day]').forEach(x=>e.attendance[x.dataset.day]=x.value);calc(e);save();$('modal').classList.add('hidden');renderTable();if(role==='employee')renderEmployee();});}
function renderEmployee(){const e=current;calc(e);$('stats').innerHTML=`<div class="card"><span>Attendance</span><strong>${e.percentage}%</strong></div><div class="card"><span>Present</span><strong>${e.present}</strong></div><div class="card"><span>Absent</span><strong>${e.absent}</strong></div><div class="card"><span>Working Days</span><strong>${e.workingDays}</strong></div>`;$('employeePanel').classList.add('hidden');$('employeeView').classList.remove('hidden');$('employeeView').innerHTML=`<div class="panel personal"><div class="profile-head"><div><div class="eyebrow">My Attendance</div><h2>${esc(e.employeeName)}</h2><p>${esc(e.employeeCode)} · ${esc(e.contractor)} · ${esc(e.status)}</p></div></div><div class="day-grid">${Object.entries(e.attendance).map(([d,s])=>`<div class="day ${s==='P'?'P':s==='A'?'A':s==='WO'?'WO':'other'}"><b>Sep ${d}</b><span>${esc(s)}</span></div>`).join('')}</div></div>`;}
function setRole(r){role=r;document.querySelectorAll('.role').forEach(b=>b.classList.toggle('active',b.dataset.role===r));$('loginId').placeholder=r==='admin'?'Sunil':'e.g. AD-12744';$('loginPassword').value='';$('loginError').textContent='';}
function login(){const id=$('loginId').value.trim(),pw=$('loginPassword').value;if(role==='admin'){if(id.toLowerCase()!=='sunil'||pw!=='admin123')return $('loginError').textContent='Invalid admin login.';current=null;}else{const e=employees.find(x=>x.employeeCode.toLowerCase()===id.toLowerCase());if(!e||pw!=='1234')return $('loginError').textContent='Invalid Employee ID or password.';current=e;}$('loginScreen').classList.add('hidden');$('app').classList.remove('hidden');$('userLabel').textContent=role==='admin'?'Sunil — Admin':current.employeeName;$('importBtn').classList.toggle('hidden',role!=='admin');$('pageTitle').textContent=role==='admin'?'Admin Attendance Dashboard':'My Attendance';$('pageSubtitle').textContent=role==='admin'?'Manage all employee attendance':'September 2026 · Data available through Day 9';if(role==='admin'){renderTable();}else renderEmployee();}
function logout(){current=null;$('app').classList.add('hidden');$('loginScreen').classList.remove('hidden');$('loginId').value='';$('loginPassword').value='';}
document.querySelectorAll('.role').forEach(b=>b.onclick=()=>setRole(b.dataset.role));$('loginBtn').onclick=login;$('loginPassword').addEventListener('keydown',e=>{if(e.key==='Enter')login()});$('logoutBtn').onclick=logout;$('search').oninput=renderTable;$('statusFilter').onchange=renderTable;$('printBtn').onclick=()=>window.print();$('closeModal').onclick=()=>$('modal').classList.add('hidden');$('modal').onclick=e=>{if(e.target===$('modal'))$('modal').classList.add('hidden')};$('importBtn').onclick=()=>$('fileInput').click();$('fileInput').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const incoming=JSON.parse(r.result);if(!Array.isArray(incoming.employees))throw 0;db.employees=incoming.employees;employees.splice(0,employees.length,...incoming.employees);employees.forEach(calc);save();renderTable();alert(`Imported ${employees.length} employee records.`)}catch{alert('Invalid attendance JSON file.')}};r.readAsText(f)};
window.showEmployee=showEmployee;employees.forEach(calc);

</script>
